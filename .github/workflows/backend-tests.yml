name: Backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postman
      - name: Install test MQTT broker
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: Real Dynamic Security integration
        env:
          MOSQUITTO_BIN: /usr/sbin/mosquitto
          MOSQUITTO_DYNSEC_PLUGIN: /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
        run: npm run test:mqtt
